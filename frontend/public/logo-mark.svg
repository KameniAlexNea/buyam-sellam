<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#ffb300"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe98a"/>
      <stop offset="1" stop-color="#e6a200"/>
    </linearGradient>
    <linearGradient id="die" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a3a63"/>
      <stop offset="1" stop-color="#101a30"/>
    </linearGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="64" cy="64" r="60" fill="none" stroke="url(#ring)" stroke-width="3"/>
  <circle cx="64" cy="64" r="60" fill="rgba(255,204,0,0.05)"/>

  <!-- ===== Balance scale (gold) ===== -->
  <!-- Finial -->
  <circle cx="64" cy="26" r="4.5" fill="url(#gold)"/>
  <!-- Beam -->
  <rect x="22" y="35" width="84" height="7" rx="3.5" fill="url(#gold)"/>
  <rect x="61" y="32" width="6" height="7" rx="2" fill="url(#gold)"/>
  <!-- Pillar -->
  <rect x="61" y="42" width="6" height="42" fill="url(#gold)"/>
  <!-- Base -->
  <path d="M52 84 H76 L72 93 H56 Z" fill="url(#gold)"/>
  <path d="M48 95 H80" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>

  <!-- Left pan: market products -->
  <path d="M22 43 L12 64 M22 43 L32 64" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M8 66 Q22 84 36 66 Z" fill="url(#gold)"/>
  <path d="M7 65 L37 65" stroke="#ffe98a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Grapes -->
  <path d="M18 55 L18 58" stroke="#a78bfa" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="12" cy="62" r="3" fill="#a78bfa" stroke="#7c5cce" stroke-width="0.8"/>
  <circle cx="16" cy="60" r="3" fill="#a78bfa" stroke="#7c5cce" stroke-width="0.8"/>
  <circle cx="20" cy="61" r="3" fill="#a78bfa" stroke="#7c5cce" stroke-width="0.8"/>
  <circle cx="14" cy="65" r="3" fill="#a78bfa" stroke="#7c5cce" stroke-width="0.8"/>
  <circle cx="18" cy="66" r="3" fill="#a78bfa" stroke="#7c5cce" stroke-width="0.8"/>
  <circle cx="22" cy="65" r="3" fill="#a78bfa" stroke="#7c5cce" stroke-width="0.8"/>
  <!-- Banana -->
  <path d="M9 57 Q22 43 35 54 Q22 51 9 57 Z" fill="#fde047" stroke="#d9a505" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- Orange -->
  <circle cx="27" cy="62" r="4.8" fill="#fb923c" stroke="#c96a12" stroke-width="1"/>
  <circle cx="25.7" cy="60.6" r="1.3" fill="#ffffff" opacity="0.55"/>
  <!-- Apple -->
  <path d="M33 55.5 L32.4 51.6" stroke="#8a5a1e" stroke-width="1.6" stroke-linecap="round"/>
  <ellipse cx="35.6" cy="51.8" rx="2.6" ry="1.3" fill="#22c55e" transform="rotate(-28 35.6 51.8)"/>
  <circle cx="33.5" cy="61" r="5" fill="#ef4444" stroke="#b91c1c" stroke-width="1"/>

  <!-- Right pan: dice -->
  <path d="M106 43 L96 64 M106 43 L116 64" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M92 66 Q106 84 120 66 Z" fill="url(#gold)"/>
  <path d="M91 65 L121 65" stroke="#ffe98a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Die 4 (gold) -->
  <rect x="94.5" y="53" width="11.5" height="11.5" rx="2.5" fill="url(#die)" stroke="#ffcc00" stroke-width="1.4"/>
  <circle cx="97.7" cy="56.2" r="1.4" fill="#ffcc00"/>
  <circle cx="102.8" cy="56.2" r="1.4" fill="#ffcc00"/>
  <circle cx="97.7" cy="61.3" r="1.4" fill="#ffcc00"/>
  <circle cx="102.8" cy="61.3" r="1.4" fill="#ffcc00"/>
  <!-- Die 5 (cyan) -->
  <rect x="110.5" y="53" width="11.5" height="11.5" rx="2.5" fill="url(#die)" stroke="#00d4ff" stroke-width="1.4"/>
  <circle cx="113.7" cy="56.2" r="1.4" fill="#00d4ff"/>
  <circle cx="118.8" cy="56.2" r="1.4" fill="#00d4ff"/>
  <circle cx="116.25" cy="58.75" r="1.4" fill="#00d4ff"/>
  <circle cx="113.7" cy="61.3" r="1.4" fill="#00d4ff"/>
  <circle cx="118.8" cy="61.3" r="1.4" fill="#00d4ff"/>
</svg>
