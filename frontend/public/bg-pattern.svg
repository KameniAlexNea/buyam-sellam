<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <pattern id="bg" width="120" height="120" patternUnits="userSpaceOnUse">
      <!-- faint grid -->
      <path d="M0 60 H120 M60 0 V120" stroke="rgba(100,180,255,0.05)" stroke-width="1"/>
      <!-- dice glyphs -->
      <g fill="none" stroke="rgba(255,204,0,0.08)" stroke-width="1.2">
        <rect x="24" y="24" width="12" height="12" rx="2"/>
        <circle cx="27" cy="27" r="0.9" fill="rgba(255,204,0,0.12)"/>
        <circle cx="33" cy="33" r="0.9" fill="rgba(255,204,0,0.12)"/>
        <rect x="84" y="84" width="12" height="12" rx="2"/>
        <circle cx="87" cy="87" r="0.9" fill="rgba(0,212,255,0.12)"/>
        <circle cx="93" cy="93" r="0.9" fill="rgba(0,212,255,0.12)"/>
      </g>
      <!-- plus markers -->
      <g stroke="rgba(0,212,255,0.07)" stroke-width="1.2" stroke-linecap="round">
        <path d="M56 10 h8 M60 6 v8"/>
        <path d="M56 110 h8 M60 106 v8"/>
        <path d="M6 56 h8 M10 52 v8"/>
        <path d="M106 56 h8 M110 52 v8"/>
      </g>
    </pattern>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
</svg>
