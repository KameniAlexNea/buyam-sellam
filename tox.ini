[tox]
envlist = format, test
requires = tox-uv
runner = uv-venv-lock-runner

[testenv:format]
description = Format and lint code with ruff
skip_install = true
deps = ruff
commands =
    ruff format backend/ksell backend/app
    ruff check --fix backend/ksell backend/app

[testenv:test]
description = Run all tests with coverage
deps =
    pytest-cov
commands =
    pytest tests/ --ignore=tests/integration --cov=ksell --cov-report=xml --cov-report=term