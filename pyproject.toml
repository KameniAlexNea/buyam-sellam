[project]
name = "buyam-sellam"
version = "0.1.0"
description = "Marketplace trading game — FastAPI backend + Next.js frontend."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
run-server = "uvicorn.main:main [app.main:app --app-dir backend --reload --host 0.0.0.0 --port 8000]"
